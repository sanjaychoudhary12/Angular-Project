<section class="auth-card" id="auth">

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>Authentication</h2>
                <p>Manage authentication & access tokens</p>
            </div>

            <button
                class="btn login"
                (click)="login()">
                🔑 Login
            </button>

            <button
                class="btn register"
                (click)="registerUser()">
                👤 Register User
            </button>

            <button
                class="btn current"
                (click)="getCurrentUser()">
                🛡 Current User
            </button>

            <!-- Optional (only if logout() exists in TS)
            <button
                class="btn logout"
                (click)="logout()">
                🚪 Logout
            </button> -->

            <!-- Old auth message preserved -->
            <div class="auth-message">
                {{ authMessage }}
            </div>

        </aside>

        <!-- Content -->
        <main class="content">

            <section class="card">

                <div class="card-header">
                    Login Response
                </div>

                <pre>
{{ loginResponse | json }}
                </pre>

            </section>

            <section class="card">

                <div class="card-header">
                    Registered User
                </div>

                <pre>
{{ registeredUser | json }}
                </pre>

            </section>

            <section class="card">

                <div class="card-header">
                    Current User
                </div>

                <pre>
{{ currentUser | json }}
                </pre>

            </section>

        </main>

    </div>

</section>
