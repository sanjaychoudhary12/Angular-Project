<section class="api-card user-card" id="users">

    <div class="card-header">

        <div class="header-left">
            <h2>User Controller</h2>
            <p>Create, Update and Manage Users</p>
        </div>

        <div class="header-right">

            <span class="api-status">● LIVE</span>

        </div>

    </div>

    <div class="controller-content">

        <!-- LEFT -->

        <div class="left-panel">

            <div class="panel-title">
                User Details
            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>Name</label>

                    <input
                    type="text"
                    placeholder="Enter Name"
                    [(ngModel)]="userName">

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                    type="email"
                    placeholder="Enter Email"
                    [(ngModel)]="userEmail">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                    type="password"
                    placeholder="Password"
                    [(ngModel)]="userPassword">

                </div>

                <div class="form-group">

                    <label>About</label>

                    <textarea
                    rows="4"
                    placeholder="About User"
                    [(ngModel)]="userAbout"></textarea>

                </div>

            </div>

            <div class="button-section">

                <h4>CRUD Operations</h4>

                <div class="action-buttons">

                    <button class="create-btn"
                    (click)="createUser()">

                        ➕ Create

                    </button>

                    <button class="update-btn"
                    (click)="updateUser()">

                        ✏ Update

                    </button>

                    <button class="delete-btn"
                    (click)="deleteUser()">

                        🗑 Delete

                    </button>

                </div>

            </div>

            <div class="button-section">

                <h4>Retrieve</h4>

                <div class="action-buttons">

                    <button
                    class="secondary-btn"
                    (click)="getAllUsers()">

                        📋 Get All

                    </button>

                    <button
                    class="secondary-btn"
                    (click)="getSingleUser()">

                        🔍 Get User

                    </button>

                </div>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="right-panel">

            <div class="response-header">

                API Response

            </div>

            <div class="response-box">

                <pre>{{ allUsers || singleUser | json }}</pre>

            </div>

            <div class="message-area">

                {{ message }}

            </div>

        </div>

    </div>

</section>
